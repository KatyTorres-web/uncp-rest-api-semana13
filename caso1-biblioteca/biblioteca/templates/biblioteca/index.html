<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biblioteca Central UNCP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --uncp: #0b3d6e;
        --dorado: #c9a227;
      }
      body {
        background: #f4f6f9;
      }
      .navbar {
        background: var(--uncp);
      }
      .btn-uncp {
        background: var(--uncp);
        color: #fff;
      }
      .btn-uncp:hover {
        background: #082c50;
        color: #fff;
      }
      .card-libro {
        border: 0;
        border-left: 4px solid var(--dorado);
      }
      .peticion {
        font-family: monospace;
        font-size: 0.85rem;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark mb-4">
      <div class="container">
        <span class="navbar-brand"
          ><i class="bi bi-book-half"></i> Biblioteca Central UNCP</span
        >
        <div class="d-flex gap-2 align-items-center">
          <a class="btn btn-sm btn-light" href="/api/docs/"
            ><i class="bi bi-file-earmark-code"></i> Swagger</a
          >
          <a class="btn btn-sm btn-light" href="/api/redoc/"
            ><i class="bi bi-journal-text"></i> ReDoc</a
          >
          <span id="usuarioActual" class="text-white small"></span>
          <button id="btnSalir" class="btn btn-sm btn-outline-light d-none">
            <i class="bi bi-box-arrow-right"></i> Salir
          </button>
        </div>
      </div>
    </nav>

    <main class="container">
      <!-- Login: obtiene un token de /api/auth/token/ -->
      <form id="formLogin" class="card card-body shadow-sm mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label small">Usuario</label>
            <input
              name="username"
              class="form-control"
              placeholder="e.ramos"
              required
            />
          </div>
          <div class="col-md-4">
            <label class="form-label small">Contraseña</label>
            <input
              name="password"
              type="password"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-4 d-grid">
            <button class="btn btn-uncp">
              <i class="bi bi-key"></i> Obtener token
            </button>
          </div>
        </div>
      </form>

      <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
          <button class="nav-link active" data-tab="catalogo">
            <i class="bi bi-collection"></i> Catálogo
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="prestamos">
            <i class="bi bi-arrow-left-right"></i> Mis préstamos
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="perfil">
            <i class="bi bi-person-badge"></i> Mi perfil
          </button>
        </li>
      </ul>

      <!-- Petición enviada a la API -->
      <div
        class="alert alert-light border d-flex justify-content-between align-items-center"
      >
        <span class="peticion"
          ><i class="bi bi-arrow-right-circle"></i>
          <span id="urlPeticion">-</span></span
        >
        <span class="badge text-bg-secondary" id="total"></span>
      </div>
      <div id="mensaje"></div>

      <!-- ===== Catálogo ===== -->
      <section id="tab-catalogo">
        <form id="filtros" class="card card-body shadow-sm mb-3">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small"
                >Buscar (título, autor, ISBN)</label
              >
              <input
                name="search"
                class="form-control"
                placeholder="algoritmos"
              />
            </div>
            <div class="col-md-3">
              <label class="form-label small">Categoría</label>
              <select name="categoria" id="selCategoria" class="form-select">
                <option value="">Todas</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label small">Año desde</label>
              <input
                name="año__gte"
                type="number"
                class="form-control"
                placeholder="2018"
              />
            </div>
            <div class="col-md-2">
              <label class="form-label small">Ordenar</label>
              <select name="ordering" class="form-select">
                <option value="">Título A-Z</option>
                <option value="-año">Más recientes</option>
                <option value="año">Más antiguos</option>
                <option value="-stock">Mayor stock</option>
              </select>
            </div>
            <div class="col-md-2 d-grid">
              <button class="btn btn-uncp">
                <i class="bi bi-search"></i> Filtrar
              </button>
            </div>
          </div>
          <div class="form-check mt-2">
            <input
              class="form-check-input"
              type="checkbox"
              name="disponible"
              value="true"
              id="chkDisp"
            />
            <label class="form-check-label small" for="chkDisp"
              >Solo disponibles</label
            >
          </div>
        </form>
        <div class="row g-3" id="libros"></div>
        <nav class="d-flex justify-content-center gap-2 my-4">
          <button class="btn btn-outline-secondary" id="btnAnterior" disabled>
            <i class="bi bi-chevron-left"></i> Anterior
          </button>
          <button class="btn btn-outline-secondary" id="btnSiguiente" disabled>
            Siguiente <i class="bi bi-chevron-right"></i>
          </button>
        </nav>
      </section>

      <!-- ===== Mis préstamos ===== -->
      <section id="tab-prestamos" class="d-none">
        <div class="table-responsive">
          <table class="table table-hover bg-white shadow-sm">
            <thead class="table-light">
              <tr>
                <th>Libro</th>
                <th>Préstamo</th>
                <th>Devolver hasta</th>
                <th>Estado</th>
                <th>Días restantes</th>
                <th>Multa</th>
              </tr>
            </thead>
            <tbody id="tablaPrestamos"></tbody>
          </table>
        </div>
      </section>

      <!-- ===== Perfil ===== -->
      <section id="tab-perfil" class="d-none">
        <div class="card card-body shadow-sm" id="perfil"></div>
      </section>
    </main>

    <script>
      let token = null,
        urlAnterior = null,
        urlSiguiente = null;
      const ESTADOS = {
        activo: "primary",
        devuelto: "success",
        vencido: "danger",
      };
      const $ = (id) => document.getElementById(id);

      // Llamada a la API: agrega el token si existe y muestra errores (401, 403, 429...)
      async function api(url, opciones = {}) {
        $("urlPeticion").textContent =
          `${opciones.method || "GET"} ${decodeURIComponent(url.replace(location.origin, ""))}`;
        $("mensaje").innerHTML = "";
        const headers = {
          "Content-Type": "application/json",
          Accept: "application/json",
        };
        if (token) headers.Authorization = `Token ${token}`;
        const resp = await fetch(url, { ...opciones, headers });
        const datos = await resp.json();
        if (!resp.ok) {
          const texto =
            datos.detail ||
            Object.entries(datos)
              .map(([k, v]) => `${k}: ${[].concat(v).join(" ")}`)
              .join(" | ");
          $("mensaje").innerHTML =
            `<div class="alert alert-${resp.status === 429 ? "warning" : "danger"}">
          <i class="bi bi-exclamation-triangle"></i> HTTP ${resp.status} - ${texto}</div>`;
          throw new Error(texto);
        }
        return datos;
      }

      // ---------- Catálogo ----------
      function urlFiltros() {
        const params = new URLSearchParams();
        for (const [k, v] of new FormData($("filtros")))
          if (v !== "") params.append(k, v);
        return "/api/libros/" + (params.toString() ? `?${params}` : "");
      }

      async function cargarLibros(url) {
        try {
          const datos = await api(url);
          $("total").textContent = `${datos.count} libro(s)`;
          urlAnterior = datos.previous;
          urlSiguiente = datos.next;
          $("btnAnterior").disabled = !urlAnterior;
          $("btnSiguiente").disabled = !urlSiguiente;
          $("libros").innerHTML = datos.results.length
            ? datos.results
                .map(
                  (l) => `
          <div class="col-md-6 col-lg-4">
            <div class="card card-libro shadow-sm h-100">
              <div class="card-body">
                <div class="d-flex justify-content-between">
                  <small class="text-muted"><i class="bi bi-tag"></i> ${l.categoria_nombre}</small>
                  <span class="badge text-bg-${l.disponible ? "success" : "secondary"}">
                    <i class="bi bi-${l.disponible ? "check-circle" : "x-circle"}"></i> ${l.disponible ? "Disponible" : "Agotado"}</span>
                </div>
                <h6 class="mt-2 mb-1">${l.titulo}</h6>
                <p class="small mb-2"><i class="bi bi-person"></i> ${l.autor.nombre}
                  <span class="text-muted">(${l.autor.nacionalidad})</span></p>
                <ul class="list-unstyled small text-muted mb-0">
                  <li><i class="bi bi-building"></i> ${l.editorial}, ${l.anio}</li>
                  <li><i class="bi bi-upc"></i> ISBN ${l.isbn}</li>
                  <li><i class="bi bi-geo-alt"></i> ${l.ubicacion}</li>
                  <li><i class="bi bi-stack"></i> Stock: ${l.stock}</li>
                </ul>
              </div>
              <div class="card-footer bg-transparent border-0">
                <a href="${l.url}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-link-45deg"></i> Ver en la API</a>
              </div>
            </div>
          </div>`,
                )
                .join("")
            : `<p class="text-center text-muted"><i class="bi bi-inbox"></i> Sin resultados.</p>`;
        } catch (e) {
          /* el error ya se mostró */
        }
      }

      async function cargarCategorias() {
        try {
          const categorias = await api("/api/categorias/");
          categorias.forEach((c) =>
            $("selCategoria").add(new Option(c.nombre, c.slug)),
          );
        } catch (e) {}
      }

      // ---------- Préstamos y perfil (requieren token) ----------
      async function cargarPrestamos() {
        if (!token) return avisoLogin();
        try {
          const datos = await api("/api/prestamos/?limit=50");
          $("total").textContent = `${datos.count} préstamo(s)`;
          $("tablaPrestamos").innerHTML =
            datos.results
              .map(
                (p) => `
          <tr>
            <td><i class="bi bi-book"></i> ${p.libro_titulo}</td>
            <td>${p.fecha_prestamo}</td>
            <td>${p.fecha_devolucion}</td>
            <td><span class="badge text-bg-${ESTADOS[p.estado]}">${p.estado}</span></td>
            <td>${p.estado === "devuelto" ? "-" : p.dias_restantes}</td>
            <td class="${Number(p.multa) > 0 ? "text-danger fw-bold" : ""}">S/ ${p.multa}</td>
          </tr>`,
              )
              .join("") ||
            `<tr><td colspan="6" class="text-center text-muted">Sin préstamos</td></tr>`;
        } catch (e) {}
      }

      async function cargarPerfil() {
        if (!token) return avisoLogin();
        try {
          const u = await api("/api/usuarios/perfil/");
          $("total").textContent = u.tipo;
          $("perfil").innerHTML = `
          <h5><i class="bi bi-person-circle"></i> ${u.nombre}</h5>
          <div class="row small">
            <div class="col-md-6">
              <p class="mb-1"><b>Usuario:</b> ${u.username}</p>
              <p class="mb-1"><b>Tipo:</b> ${u.tipo}</p>
              <p class="mb-1"><b>Carrera:</b> ${u.carrera}</p>
            </div>
            <div class="col-md-6">
              <p class="mb-1"><b>Email:</b> ${u.email}</p>
              <p class="mb-1"><b>Teléfono:</b> ${u.telefono}</p>
              <p class="mb-1"><b>Préstamos activos:</b> ${u.prestamos_activos} de 5</p>
              <p class="mb-1"><b>Multa total:</b> S/ ${u.multa_total}</p>
            </div>
          </div>`;
        } catch (e) {}
      }

      function avisoLogin() {
        $("mensaje").innerHTML =
          `<div class="alert alert-info"><i class="bi bi-info-circle"></i> Primero obtenga un token (inicie sesión).</div>`;
      }

      // ---------- Eventos ----------
      $("formLogin").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const datos = await api("/api/auth/token/", {
            method: "POST",
            body: JSON.stringify(Object.fromEntries(new FormData(e.target))),
          });
          token = datos.token;
          $("usuarioActual").innerHTML =
            `<i class="bi bi-person-check"></i> ${e.target.username.value} | Token ${token.slice(0, 8)}...`;
          $("btnSalir").classList.remove("d-none");
          e.target.classList.add("d-none");
        } catch (e) {}
      });
      $("btnSalir").onclick = () => location.reload();

      document.querySelectorAll("[data-tab]").forEach(
        (boton) =>
          (boton.onclick = () => {
            document
              .querySelectorAll("[data-tab]")
              .forEach((b) => b.classList.toggle("active", b === boton));
            ["catalogo", "prestamos", "perfil"].forEach((t) =>
              $(`tab-${t}`).classList.toggle("d-none", t !== boton.dataset.tab),
            );
            ({
              catalogo: () => cargarLibros(urlFiltros()),
              prestamos: cargarPrestamos,
              perfil: cargarPerfil,
            })[boton.dataset.tab]();
          }),
      );

      $("filtros").addEventListener("submit", (e) => {
        e.preventDefault();
        cargarLibros(urlFiltros());
      });
      $("btnAnterior").onclick = () => urlAnterior && cargarLibros(urlAnterior);
      $("btnSiguiente").onclick = () =>
        urlSiguiente && cargarLibros(urlSiguiente);

      cargarCategorias().then(() => cargarLibros("/api/libros/"));
    </script>
  </body>
</html>
